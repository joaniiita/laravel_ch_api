<div class="container-fluid p-4">

  <!-- Create button-->
  <a [routerLink]="['/admin/categoryCreate']" class="btn btn-yellow mb-3">
    <i class="bi bi-plus-lg me-1"></i> New
  </a>

  <div class="card shadow-sm">
    <div class="card-body p-0">
      <div class="table-responsive">
        <table class="table table-hover mb-0">
          <thead>
          <tr class="table-light">
            <th>ID</th>
            <th>Name</th>
            <th class="text-center">Acciones</th>
          </tr>
          </thead>
          <tbody> @for (item of categories() | paginate: {itemsPerPage: pageSize(), currentPage: page()}; track item.id) {
            <tr app-category-row
                [category]="item"
                (onDelete)="deleteCategory($event)">
            </tr>
          }
          </tbody>
        </table>
      </div>
    </div>
  </div>


  <div class="d-flex justify-content-end mt-4">
    <pagination-controls (pageChange)="page.set($event)"></pagination-controls>
  </div>

</div>
